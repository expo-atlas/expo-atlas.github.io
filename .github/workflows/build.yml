# Builds the site with its data: the page is here, the files it shows (files/, data/, figures/, maps.json) come from the
# organisation's private repository `<organisation>-data`, read with the read-only token in the secret DATA_TOKEN, and are
# put in only for the build, so they are on the site but not in this repository. Runs on a push here and by hand
# (Actions, Run workflow; started after the data changes).
name: Build with data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: _page
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}-data
          token: ${{ secrets.DATA_TOKEN }}
          path: _data_in
      - name: Put page and data in place
        # named files only, so nothing else in either repository is published; a new page file is added here
        run: |
          mkdir _site
          cd _page && cp index.html .nojekyll favicon.ico favicon.svg favicon-32.png apple-touch-icon.png ../_site/ && cd ..
          cp -r _data_in/files _data_in/data _data_in/figures _data_in/maps.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
